# interaction-service. Values come from the environment in every deployment; the
# defaults here are the local compose stack (docker-compose.yml, .env.example).
spring:
  application:
    name: interaction-service
  datasource:
    # `public` must stay on the search path alongside `interaction`: pg_trgm's
    # similarity() and the % operator are resolved at query time, and db/init puts
    # the extensions in public.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/client360?currentSchema=interaction,public}
    username: ${SPRING_DATASOURCE_USERNAME:client360}
    password: ${SPRING_DATASOURCE_PASSWORD:client360_local_only}
    hikari:
      pool-name: interaction-service
      maximum-pool-size: 20
  flyway:
    locations: classpath:db/migration
    schemas: interaction
    default-schema: interaction
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      # The denormalized ownership columns are rebuilt from the topic, so a fresh deployment
      # reads what is still retained rather than starting blind (V6).
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

spring.servlet.multipart:
  # The service refuses >10 MB itself with ATTACHMENT_TOO_LARGE (§6.2.3 ck_att_size); this is the
  # container's own backstop, set a little higher so the API's error is what a caller sees rather
  # than Tomcat's.
  max-file-size: 12MB
  max-request-size: 12MB

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

client360:
  crypto:
    data-key: ${CLIENT360_CRYPTO_DEV_KEY:}
    pepper: ${CLIENT360_CRYPTO_DEV_PEPPER:}
    key-version: 1
  security:
    jwt:
      public-key: ${CLIENT360_JWT_PUBLIC_KEY:}
      public-key-location: ${CLIENT360_JWT_PUBLIC_KEY_LOCATION:}
      issuer: ${CLIENT360_JWT_ISSUER:}
  # The authorization authority (§3.1). Inside compose the service name resolves;
  # from the host it is localhost:8080.
  client-service:
    base-url: ${CLIENT360_CLIENT_SERVICE_URL:http://localhost:8080}
    timeout: 2s
  # Attachment storage (IL-US-06). MinIO locally, a real bucket in a deployed environment —
  # the endpoint is the only difference, because both speak the S3 API.
  s3:
    endpoint: ${CLIENT360_S3_ENDPOINT:http://localhost:9000}
    bucket: ${CLIENT360_S3_BUCKET:client360-attachments}
    access-key: ${MINIO_ROOT_USER:client360}
    secret-key: ${MINIO_ROOT_PASSWORD:client360_local_only}
    # §6.3: long enough to follow a redirect, short enough that a copied link is already dead.
    link-ttl: 60s

logging:
  level:
    root: INFO
    com.client360: INFO
