# audit-service. Values come from the environment in every deployment; the defaults
# here are the local compose stack (docker-compose.yml, .env.example).
spring:
  application:
    name: audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/client360?currentSchema=audit,public}
    username: ${SPRING_DATASOURCE_USERNAME:client360}
    password: ${SPRING_DATASOURCE_PASSWORD:client360_local_only}
    hikari:
      pool-name: audit-service
      maximum-pool-size: 20
  flyway:
    locations: classpath:db/migration
    schemas: audit
    default-schema: audit
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      # The log is rebuilt from the topic on a fresh deployment, so it reads what is retained
      # rather than starting blank.
      auto-offset-reset: earliest
      # Offsets are committed by this service only after the row is stored, so at-least-once
      # delivery becomes exactly-once storage via ux_audit_event (AT-BR-03).
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # This service publishes exactly one thing: its own reads, to audit.events (AT-BR-10). It has
    # no other producer role, and must never acquire one.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

client360:
  audit:
    # §8.3's audit exports. The bucket is the same object store the attachments live in, under its
    # own prefix — a second bucket would be a second thing to provision for no isolation this
    # service needs, since nothing else writes under audit-exports/.
    export:
      endpoint: ${CLIENT360_S3_ENDPOINT:}
      bucket: ${CLIENT360_AUDIT_EXPORT_BUCKET:client360-audit-exports}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      # §8.3: a pre-signed link valid 15 minutes. It is not a share mechanism.
      link-ttl: ${CLIENT360_AUDIT_EXPORT_LINK_TTL:15m}
      # How long the file is kept before the sweeper deletes it and the job answers 410.
      retention: ${CLIENT360_AUDIT_EXPORT_RETENTION:7d}
      # AT-EC-09's ceiling. Past this the filter is the problem, not the export.
      max-rows: ${CLIENT360_AUDIT_EXPORT_MAX_ROWS:5000000}

logging:
  level:
    root: INFO
    com.client360: INFO
