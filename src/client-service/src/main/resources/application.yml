# client-service. Values come from the environment in every deployment; the defaults
# here are the local compose stack (docker-compose.yml, .env.example).
spring:
  application:
    # EventFactory stamps this as the event envelope's `service` (SPEC.md §3.3).
    name: client-service
  datasource:
    # `public` must stay on the search path alongside `client`: pg_trgm's similarity() and
    # the % operator are resolved at query time, and db/init puts the extensions in public.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/client360?currentSchema=client,public}
    username: ${SPRING_DATASOURCE_USERNAME:client360}
    password: ${SPRING_DATASOURCE_PASSWORD:client360_local_only}
    hikari:
      pool-name: client-service
      maximum-pool-size: 20
  flyway:
    # Packaged from db/migrations/client-service by the pom, so the service applies
    # exactly the files the compose Flyway container applies.
    locations: classpath:db/migration
    schemas: client
    default-schema: client
  jpa:
    # The schema belongs to Flyway. Hibernate is present for the transaction manager
    # and Pageable only; it must never touch DDL.
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

client360:
  crypto:
    data-key: ${CLIENT360_CRYPTO_DEV_KEY:}
    pepper: ${CLIENT360_CRYPTO_DEV_PEPPER:}
    key-version: 1
  security:
    jwt:
      public-key: ${CLIENT360_JWT_PUBLIC_KEY:}
      public-key-location: ${CLIENT360_JWT_PUBLIC_KEY_LOCATION:}
      issuer: ${CLIENT360_JWT_ISSUER:}
  interaction-service:
    # Read by GET /clients/{id}/summary only, for the timeline panel of the card.
    base-url: ${CLIENT360_INTERACTION_SERVICE_URL:http://localhost:8081}
    # The §5.3 sub-resource budget. It bounds one panel, never the whole card: past it the
    # panel is reported in `degraded[]` and the card still paints.
    timeout: ${CLIENT360_INTERACTION_SERVICE_TIMEOUT:800ms}

logging:
  level:
    root: INFO
    com.client360: INFO
