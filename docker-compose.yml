name: client360

# One-command local environment (SPEC.md §10.7).
#
#   docker compose up -d              infra + migrations (works today, no Java needed)
#   docker compose --profile seed up  add local seed data
#   docker compose --profile app up   add the three services (once src/ is built)

services:

  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: client360-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-client360}
      POSTGRES_USER: ${POSTGRES_USER:-client360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-client360_local_only}
      # SPEC.md §4.1: every timestamp is UTC. Keep the container honest.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-client360} -d ${POSTGRES_DB:-client360}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------- Flyway (one-shot)
  # Each service owns its own schema and its own migration history (CLAUDE.md
  # → Architecture). Two independent Flyway runs, two history tables.
  flyway-client:
    image: flyway/flyway:10-alpine
    container_name: client360-flyway-client
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations/client-service:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-client360}
      -user=${POSTGRES_USER:-client360}
      -password=${POSTGRES_PASSWORD:-client360_local_only}
      -schemas=client
      -defaultSchema=client
      -connectRetries=15
      -baselineOnMigrate=false
      migrate

  flyway-interaction:
    image: flyway/flyway:10-alpine
    container_name: client360-flyway-interaction
    depends_on:
      postgres:
        condition: service_healthy
      # interactions carry FKs into client.clients / client.users in the shared
      # dev database, so the client schema must exist first.
      flyway-client:
        condition: service_completed_successfully
    volumes:
      - ./db/migrations/interaction-service:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-client360}
      -user=${POSTGRES_USER:-client360}
      -password=${POSTGRES_PASSWORD:-client360_local_only}
      -schemas=interaction
      -defaultSchema=interaction
      -connectRetries=15
      migrate

  flyway-audit:
    image: flyway/flyway:10-alpine
    container_name: client360-flyway-audit
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations/audit-service:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-client360}
      -user=${POSTGRES_USER:-client360}
      -password=${POSTGRES_PASSWORD:-client360_local_only}
      -schemas=audit
      -defaultSchema=audit
      -connectRetries=15
      migrate

  # ------------------------------------------------------------ Seed (opt-in)
  seed:
    image: postgres:16-alpine
    container_name: client360-seed
    profiles: ["seed"]
    depends_on:
      flyway-interaction:
        condition: service_completed_successfully
    # No shell: psql is the entrypoint and connection details come from PG* env
    # vars, so there is nothing to quote, split or escape.
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-client360}
      PGDATABASE: ${POSTGRES_DB:-client360}
      PGPASSWORD: ${POSTGRES_PASSWORD:-client360_local_only}
    volumes:
      - ./db/seed/local:/seed:ro
    entrypoint: ["psql"]
    command: ["-v", "ON_ERROR_STOP=1", "-f", "/seed/seed_local.sql"]

  # --------------------------------------------------------------- Kafka
  # KRaft mode, single broker. Partition counts per SPEC.md §3.2.
  kafka:
    image: apache/kafka:3.8.0
    container_name: client360-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: client360-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    # Deliberately free of '$': compose treats '$' as interpolation and needs '$$'
    # escaping, which is easy to misread and survives `docker compose config`
    # ambiguously. Explicit lines are longer and cannot be misread.
    # Partition counts are SPEC.md §3.2.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /opt/kafka/bin
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions 6 --topic client.events
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions 6 --topic interaction.events
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions 6 --topic task.events
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions 3 --topic auth.events
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions 1 --topic client.events.DLT
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions 1 --topic interaction.events.DLT
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions 1 --topic task.events.DLT
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions 1 --topic auth.events.DLT
        echo '--- topics ---'
        ./kafka-topics.sh --bootstrap-server kafka:9092 --list

  # --------------------------------------------------------------- MinIO
  # Object store for interaction attachments (SPEC.md §6.2.3).
  # Object storage for interaction attachments (IL-US-06), over the S3 API.
  #
  # LocalStack rather than MinIO, and not by preference: MinIO stopped publishing pullable images.
  # docker.io/minio/minio and quay.io/minio/minio both answer 401/denied, so `docker compose up` on
  # a fresh clone could not start and CI could not run the attachment tests. Chainguard publishes
  # MinIO but only at :latest, and this file pins every other image for a reason — an unpinned
  # dependency is a stack that breaks overnight without a commit.
  #
  # The application is unaffected: interaction-service speaks the S3 API through the AWS SDK rather
  # than a MinIO client, precisely so the server behind it is a configuration choice. The endpoint
  # moves and nothing else does.
  s3:
    image: localstack/localstack:3.8
    container_name: client360-s3
    environment:
      SERVICES: s3
      # LocalStack's S3 accepts any credentials, but the services are configured with these so the
      # local stack and a deployed one differ in the endpoint alone.
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${S3_PORT:-4566}:4566"
    volumes:
      - s3data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  s3-init:
    image: amazon/aws-cli:2.27.49
    container_name: client360-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-client360}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-client360_local_only}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      aws --endpoint-url http://s3:4566 s3api create-bucket --bucket client360-attachments 2>/dev/null || true
      aws --endpoint-url http://s3:4566 s3api put-bucket-versioning --bucket client360-attachments           --versioning-configuration Status=Enabled
      echo 'bucket ready: client360-attachments'
      "

  # ------------------------------------------------- Application services
  #   docker compose --profile app up -d --build
  #
  # Both build from the repository root with one Dockerfile: the Maven reactor needs the parent
  # pom, the sibling `common` module and db/migrations, so a service directory is not a usable
  # build context.
  #
  # Neither service declares depends_on the other, and that is deliberate. client-service reads the
  # timeline for the card and interaction-service asks client-service to authorize — the dependency
  # is mutual, so any ordering here would be a lie, and compose would reject the cycle. Each starts
  # alone and degrades until the other answers.
  client-service:
    profiles: ["app"]
    build:
      context: .
      args:
        SERVICE: client-service
    container_name: client360-client-service
    depends_on:
      flyway-client:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-client360}?currentSchema=client,public
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-client360}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-client360_local_only}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLIENT360_CRYPTO_DEV_KEY: ${CLIENT360_CRYPTO_DEV_KEY}
      CLIENT360_CRYPTO_DEV_PEPPER: ${CLIENT360_CRYPTO_DEV_PEPPER}
      # The RS256 keypair, from scripts/dev-jwt.sh. This service holds both halves because it
      # issues the tokens the other two only verify (SPEC.md §9.3) — it is the one place in the
      # stack that can sign, and therefore the one place a signing key belongs.
      CLIENT360_JWT_PUBLIC_KEY: ${CLIENT360_JWT_PUBLIC_KEY}
      CLIENT360_JWT_PRIVATE_KEY: ${CLIENT360_JWT_PRIVATE_KEY}
      # The card's timeline panel (GET /clients/{id}/summary).
      CLIENT360_INTERACTION_SERVICE_URL: http://interaction-service:8080
    ports:
      - "8080:8080"

  interaction-service:
    profiles: ["app"]
    build:
      context: .
      args:
        SERVICE: interaction-service
    container_name: client360-interaction-service
    depends_on:
      flyway-interaction:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-client360}?currentSchema=interaction,public
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-client360}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-client360_local_only}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLIENT360_S3_ENDPOINT: http://s3:4566
      CLIENT360_S3_BUCKET: client360-attachments
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-client360}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-client360_local_only}
      CLIENT360_CRYPTO_DEV_KEY: ${CLIENT360_CRYPTO_DEV_KEY}
      CLIENT360_CRYPTO_DEV_PEPPER: ${CLIENT360_CRYPTO_DEV_PEPPER}
      CLIENT360_JWT_PUBLIC_KEY: ${CLIENT360_JWT_PUBLIC_KEY}
      # The authorization authority (§3.1). Without this the default points at localhost, which
      # inside a container is this service itself, and every access check would fail.
      CLIENT360_CLIENT_SERVICE_URL: http://client-service:8080
    ports:
      - "8081:8080"

  # audit-service joins in v2 (§11.1). src/audit-service holds no module yet, so a service
  # definition here would only break `--profile app` for everyone. Its topics are already being
  # written: the outbox publishes from day one and the consumer arrives later, which is the whole
  # point of the ordering.

volumes:
  pgdata:
  kafkadata:
  s3data:
